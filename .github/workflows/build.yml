name: Build Example TAPPs

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: build

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick clang lld llvm

    - name: Check dependencies
      run: make check

    # nanopb is deliberately not vendored — a tapp only needs it if it ships a .proto, so the
    # instructions tell authors to add it themselves. examples/persistence does ship one, so CI
    # walks that same path: fetch nanopb next to the SDK, where tapp-build looks for it.
    - name: Fetch nanopb (for .proto examples)
      run: |
        git clone --depth 1 https://github.com/nanopb/nanopb.git nanopb
        pip install --quiet protobuf grpcio-tools

    - name: Build examples
      run: |
        mkdir -p out
        # nullglob: an unmatched glob would otherwise be passed through literally and tapp-build
        # would fail on the string "examples/*.c" instead of the loop simply not running.
        shopt -s nullglob
        n=0
        for src in examples/*.c; do
          name=$(basename "$src" .c)
          echo "::group::$name"
          ./tapp-build "$src" "out/$name.tapp"
          echo "::endgroup::"
          n=$((n+1))
        done
        # Folder-style apps (multi-file, or carrying assets) — tapp-build takes the directory.
        for dir in examples/*/; do
          ls "$dir"*.c >/dev/null 2>&1 || { echo "skipping $dir (no .c)"; continue; }
          name=$(basename "$dir")
          echo "::group::$name"
          ./tapp-build "$dir" "out/$name.tapp"
          echo "::endgroup::"
          n=$((n+1))
        done
        # Auto-detection that matches nothing is worse than a hardcoded list: the job would go
        # green having built zero apps. Fail loudly, and print the count so the log shows coverage.
        [ "$n" -gt 0 ] || { echo "::error::no examples found under examples/"; exit 1; }
        echo "built $n example(s)"

    - name: Verify TAPPs
      run: ./tools/verify-tapp.sh out/*.tapp

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tapps
        path: out/*.tapp
